# FloodVR model + policy configuration.
# No model name is hardcoded anywhere in the Python. Change it here.
#
# NVIDIA ids are verified against build.nvidia.com by:  python -m agents.tools.verify_models
# That script rewrites `verified` below and reports any 404.

providers:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  anthropic:
    api_key_env: ANTHROPIC_API_KEY

models:
  orchestrator:
    provider: nvidia
    # nemotron-3-super-120b-a12b is LISTED but 404s on chat completions.
    id: nvidia/nemotron-3.5-super-vl-120b-a12b
    role: Plans the run and merges agent output. Needs tool calling.
    tool_calling: true
    verified: 2026-11-07
    fallback_ids:
      - nvidia/llama-3.1-nemotron-ultra-253b-v1
      - nvidia/llama-3.1-nemotron-70b-instruct
  intake:
    provider: nvidia
    # nemotron-nano-3-30b-a3b is LISTED but 404s on chat completions.
    id: nvidia/nemotron-3.5-lightning-30b-a3b
    role: Quarantined extraction from untrusted evidence. NO TOOLS.
    tool_calling: false
    verified: 2026-11-07
    fallback_ids:
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - nvidia/llama-3.1-nemotron-70b-instruct
  vlm:
    provider: nvidia
    id: nvidia/nemotron-3.5-super-vl-120b-a12b
    role: Reads text and damage out of VR screenshots (the fridge note).
    vision: true
    verified: 2026-11-07
    fallback_ids:
      - nvidia/cosmos-reason2-8b
      - meta/llama-3.2-90b-vision-instruct
  guard:
    provider: nvidia
    id: nvidia/nemotron-3.5-content-safety
    role: Second detection layer after the rules.
    verified: 2026-11-07
    # nvidia/nemoguard-jailbreak-detect is NOT served on the hosted API (404) —
    # it ships as a downloadable NIM container. Fallbacks are tried in order.
    fallback_ids:
      - nvidia/llama-3.1-nemotron-safety-guard-8b-v3
      - nvidia/llama-3.1-nemoguard-8b-content-safety
      - meta/llama-guard-4-12b
  claude_fallback:
    provider: anthropic
    id: claude-opus-5-5
    role: Stand-in brain if NVIDIA is unreachable mid-demo.
    verified: current
  claude_redteam:
    provider: anthropic
    id: claude-opus-5-5
    role: Writes held-out attack variants for evals/gen_variants.
    verified: current

# Anthropic request defaults. budget_tokens is removed on this model family;
# depth is controlled by effort. Prefill and forced tool_choice are rejected.
anthropic_defaults:
  max_tokens: 16000
  effort: medium
  thinking: adaptive

runtime:
  # offline = deterministic stubs, no network, no keys. evals must pass here.
  offline: true
  request_timeout_s: 60
  max_retries: 2

guard:
  rules_enabled: true
  # OFF by default. /assess guards ~46 text fields per run, so a second model
  # layer costs 46 extra calls per claim. Turn on only once the bake-off shows a
  # candidate that actually detects injection — NVIDIA's content-safety model
  # scored our live fridge-note attack as "safe".
  guard_model_enabled: false
  llm_judge_enabled: false
  # Block at or above this rule score even if the guard model disagrees.
  block_threshold: 0.5
  canary_prefix: FLOODVR-CANARY

policy:
  waterline_m: 0.9
  file: contracts/policy.json
  costs_file: contracts/costs.json

server:
  cors_origins:
    - https://*.vercel.app
    - http://localhost:3000
    - http://localhost:5173
